<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Text Converter</title>
    <style>
        /* Page background */
        body {
            background: #f5f5f5; /* light grey background */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container for the form */
        .converter-container {
            background: #ffffff; /* white box */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 600px;
        }

        /* Title */
        .converter-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Text area */
        textarea[name="user_input"] {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: vertical; /* allow vertical resizing */
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        textarea[name="user_input"]:focus {
            border-color: darkorange;
            outline: none;
        }

        /* Convert button */
        button[type="submit"] {
            background-color: darkorange;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button[type="submit"]:hover {
            background-color: #e69500;
        }

        /* Result box */
        .result {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            word-wrap: break-word;
        }

        .result h3 {
            margin-top: 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="converter-container">
        <h1>Text Converter</h1>
        <form method="post">
            {% csrf_token %}
            <textarea name="user_input" placeholder="Enter your text here">{{ original_text }}</textarea>
            <button type="submit">Convert</button>
        </form>

        {% if converted_text %}
        <div class="result">
            <h3>Result:</h3>
            <p>{{ converted_text }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
